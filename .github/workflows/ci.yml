name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs of the same ref so only the latest push is tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: React and React DOM versions match
        run: node .github/scripts/check-react-versions.mjs
      - run: yarn typecheck
      - run: yarn vitest run

  build-web:
    name: Web production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Same command and env the Dockerfile uses for the production image.
      # NODE_ENV is set here, not on the job: with NODE_ENV=production yarn skips
      # devDependencies during install and the patch-package postinstall fails.
      - run: yarn expo export --platform web --output-dir dist
        env:
          NODE_ENV: production
          APP_ENV: production

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build production image (not pushed)
        run: docker build --tag lvecde-web:ci .
