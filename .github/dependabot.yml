version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # One PR for routine bumps instead of one per package.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React Native pins its renderer to an exact React version, so react,
      # react-dom and react-native must move together with an Expo SDK
      # upgrade. A lone bump breaks the app (see .github/scripts/check-react-versions.mjs).
      - dependency-name: react
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
